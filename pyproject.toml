[project]
name = "images"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pillow>=13.0.0",
    "textual>=8.2.8",
    "typesafe-sdk>=0.7.5",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[project.scripts]
safelight = "safelight.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["safelight"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
